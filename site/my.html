<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 예약 · 아일로 풀빌라</title>
  <meta name="description" content="카카오로 로그인하면 아일로 풀빌라에서 내가 한 예약만 모아서 볼 수 있어요.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="glass-buttons.css">
  <link rel="stylesheet" href="payment.css">
</head>
<body class="pay-page">
  <header class="pay-top"><a class="pay-brand" href="index.html">AILO <span>POOL VILLA</span></a></header>

  <main class="pay-wrap inq-wrap">
    <a class="bk-back back-to-top" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg><span>사이트로 돌아가기</span></a>
    <p class="pay-kicker" lang="en">MY STAY</p>
    <h1 class="pay-title" id="myTitle">내 예약</h1>
    <p class="my-notice" id="notice" role="status" hidden></p>

    <!-- 로그인 전 -->
    <div class="pay-card my-login" id="loginBox" hidden>
      <p class="inq-lead">카카오로 로그인하면 내가 한 예약만 모아서 보여 드려요. 비밀번호는 만들지 않아요.</p>
      <a class="kakao-btn" id="kakaoLogin" href="/api/auth/kakao/login?next=/my.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3.6c-5 0-9 3.1-9 7 0 2.5 1.7 4.7 4.2 6l-1 3.7c-.1.3.3.6.6.4l4.4-2.9c.3 0 .5.1.8.1 5 0 9-3.1 9-7s-4-7.3-9-7.3Z"/></svg><span>카카오로 시작하기</span></a>
      <p class="pay-note">카카오 회원번호와 닉네임만 저장합니다. 자세한 내용은 <a href="privacy.html">개인정보 처리방침</a>을 확인해 주세요.</p>
    </div>

    <!-- 로그인 후 -->
    <div id="memberBox" hidden>
      <div class="my-list" id="list" aria-live="polite"></div>
      <div class="pay-actions my-actions">
        <a class="is-primary" href="booking.html">새 예약하기</a>
        <button type="button" class="my-btn" id="logoutButton">로그아웃</button>
      </div>
      <div class="my-withdraw">
        <button type="button" class="my-link-btn" id="withdrawButton">회원 탈퇴</button>
        <p class="pay-note">탈퇴하면 카카오 연결이 끊기고 회원 정보(회원번호·닉네임)가 지워집니다. 이미 한 예약은 숙박·환불 처리를 위해 남지만 더 이상 이 화면에서 보이지 않습니다. 탈퇴 전에 카카오에서 한 번 더 로그인해 본인 확인을 합니다.</p>
      </div>
    </div>

    <p class="pay-error" id="error" role="alert"></p>
  </main>
  <script src="my.js"></script>
</body>
</html>
